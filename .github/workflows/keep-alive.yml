name: Keep API awake

# Render's free tier stops a web service after 15 minutes without traffic, and a
# cold boot costs ~45 seconds — that wait lands on the login button. GitHub
# throttles a */5 schedule hard on a quiet repo (it fired a handful of times a
# day), so one ping per run was not enough: each run now holds the service warm
# for the rest of the job budget, pinging every 5 minutes.
#
# Only the API is pinged. Keeping both free services awake around the clock would
# approach Render's 750 free instance-hours per month, so the insights service is
# left to sleep.
on:
  schedule:
    - cron: '*/5 * * * *'
  # Every deploy already wakes the instance; this keeps it awake afterwards
  # instead of waiting for GitHub to get around to the schedule.
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Overlapping runs only add extra pings, which is harmless.
concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Ping the API health endpoint
        run: |
          api=https://finsight-api-0878.onrender.com/api/health
          # ~5h20m of coverage per run; the job limit is 6h.
          end=$(( $(date +%s) + 320 * 60 ))

          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$api" || true)
            echo "$(date -u +%H:%M:%S) $api -> ${code:-no response}"
            sleep 300
          done
