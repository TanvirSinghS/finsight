services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
    ports:
      - "5432:5432"
    volumes:
      - finsight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 12

  insights:
    build:
      context: ./insights-python
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/finsight
      DB_USERNAME: finsight
      DB_PASSWORD: finsight
      JWT_SECRET: local-docker-secret-change-me-at-least-32-bytes-long
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      INSIGHTS_SERVICE_URL: http://insights:8000
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      insights:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  finsight_pgdata:
