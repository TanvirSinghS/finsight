spring.application.name=finsight-api
server.port=${PORT:8080}

# Neon / local PostgreSQL. Example: jdbc:postgresql://host/db?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finsight}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-me-please-32chars}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.insights.url=${INSIGHTS_SERVICE_URL:http://localhost:8000}
app.insights.timeout-seconds=${INSIGHTS_TIMEOUT_SECONDS:20}
app.currency.api-url=${FRANKFURTER_URL:https://api.frankfurter.app}
app.currency.cache-minutes=${CURRENCY_CACHE_MINUTES:360}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
info.app.name=FinSight API
info.app.version=1.0.0

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

logging.level.org.hibernate.SQL=warn
